{% extends 'base.html' %}
{% load static %}

{% block title %}Confirm Delete - {{ item.name }}{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h3>Confirm Deletion</h3>
                </div>
                <div class="card-body">
                    <p>Are you sure you want to delete the item: <strong>"{{ item.name }}"</strong>?</p>
                    <p>This action cannot be undone.</p>
                    <form method="post" action="{% url 'menu:item_delete' item.pk %}">
                        {% csrf_token %}
                        <div class="d-flex justify-content-end">
                            <a href="{% url 'menu:item_dashboard' %}" class="btn btn-secondary me-2">Cancel</a>
                            <button type="submit" class="btn btn-danger">Delete</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
